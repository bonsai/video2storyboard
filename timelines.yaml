# Source-video timeline for the current analysis run.
# Only the dance segment is in scope for MediaPipe still-image pose analysis.
schema_version: "1.0"

source:
  video_url: "https://www.youtube.com/watch?v=U6dnieqgYvI"
  duration_reference: "user-provided timestamps"

segments:
  - id: appearance
    start: "00:01:45"
    end: "00:02:20"
    label: appearance
    include_in_pose_analysis: false

  - id: skeleton_dance
    start: "00:02:20"
    end: "00:03:45"
    interval: "[start, end)"
    label: skeleton_dance
    include_in_pose_analysis: true
    frame_input: still_image
    frame_format: png

  - id: performance
    start: "00:03:45"
    end: "00:04:57"
    label: performance
    include_in_pose_analysis: false

selection:
  target_segment_ids:
    - skeleton_dance
  start_inclusive: true
  end_inclusive: false
  timestamp_basis: source_video
  preserve_source_timestamps: true
  skip_frames_outside_target_segments: true
  skip_unclassified_frames: true

notes:
  - "Only 00:02:20 <= frame timestamp < 00:03:45 is in scope for this run."
  - "The appearance segment and the performance segment are excluded."
  - "Extract still frames from the source video; do not pass the video stream directly to the MediaPipe Python layer."
  - "This file declares the timeline; runtime code must load it and apply the segment filter for enforcement."
