dsl_version: "1.0"
name: dance-retarget
interval:
  start_seconds: 140.0
  end_seconds: 225.0
source_video: "/path/to/video.mp4"
frame_interval_seconds: 1.0
pose:
  model_path: "${VIDEO2STORYBOARD_POSE_MODEL:models/pose_landmarker.task}"
  min_detection_confidence: 0.5
  min_pose_presence_confidence: 0.5
transform:
  source_joint_space: mediapipe
  target_space: blender_armature
  smoothing: linear
  interpolation_order: 3
rig:
  joint_order:
    - hips
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle
    - thorax
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - neck
    - head
  target_rig: dance_rig
  scale_factor: 1.0
output:
  format: ir_json
  version: "1.0"
  artifacts:
    - frame_png
    - pose_overlay_png
    - pose_overlay_svg
    - dance_ir_json
  validation:
    check_timestamp_continuity: true
    check_frame_dimensions: true
    report_missing_frames: true
  backend:
    blender_script_path: backends/blender.py
