schema_version: "1.1"

workflow:
  id: dev
  name: YAML-first storyboard visual reconstruction development
  status: specification
  canonical_definition: "config/storyboard-visualization.yaml"
  purpose: >
    Orchestrate development itself with LangGraph. Visualization and shareable
    artifacts are required outputs of development, not optional documentation.
  orchestration:
    engine: langgraph
    development_itself_is_orchestrated: true
    manual_llm_step_by_step_direction: false
    rule: "Inspect, survey, implement one small unit, test, visualize, share, report."

scope:
  focus: storyboard_image_reconstruction
  workers:
    - mp_pose
    - cv2
    - vlm
  excluded:
    - stt
    - audio_analysis
    - 3d_character_retargeting
    - unrelated_workers

defaults:
  execution: local
  cloud_fallback: false
  upload_source_media: false
  prefer_existing_libraries: true
  survey_before_custom_implementation: true
  allow_polyglot: true
  interchange_format: json
  execution_log_format: jsonl

source:
  timeline_file: "timelines.yaml"
  segment_id: skeleton_dance
  interval:
    start: "00:02:20"
    end: "00:03:45"
    start_inclusive: true
    end_inclusive: false
  preserve_source_timestamps: true

development_stages:
  - id: inspect
    action: repository_inspection
    required: true
  - id: survey
    action: survey_existing_libraries_and_projects
    required: true
    before_custom_implementation: true
  - id: define_contracts
    action: load_and_validate_yaml_contracts
    required: true
  - id: implement
    action: implement_small_testable_unit
    required: true
  - id: test
    action: run_tests_and_validate_artifacts
    required: true
  - id: visualize
    action: generate_visualization_from_actual_code_and_outputs
    required: true
  - id: share
    action: save_artifacts_and_update_map
    required: true
  - id: report
    action: report_evidence_failures_blockers_and_links
    required: true

visualization:
  mandatory: true
  specification: "config/storyboard-visualization.yaml"
  artifacts_root: "artifacts/"
  required_kinds:
    - class_and_data_structure_diagram
    - actual_langgraph_topology_diagram
    - mp_cv2_vlm_worker_contract_diagram
    - storyboard_reconstruction_review
    - human_readable_map
  policy:
    - "Use py2puml for supported Python class/data relationships."
    - "Do not claim py2puml represents LangGraph edges or function-only workers completely."
    - "Generate separate diagrams from actual graph topology and worker contracts."
    - "Include repository links to the artifacts in every completion report."
    - "If required visualization cannot be generated, mark the run blocked."

quality_gates:
  - id: scope
    checks:
      - "Active visual reconstruction path uses MP, CV2, and VLM only."
      - "Audio/STT and 3D retargeting are excluded."
  - id: timeline
    checks:
      - "00:02:20 is included."
      - "00:03:45 is excluded."
      - "Out-of-segment frames never reach reconstruction workers."
  - id: contracts
    checks:
      - "YAML definitions load and validate."
      - "JSON outputs preserve frame ID, source timestamp, dimensions, and coordinate convention."
      - "No-pose, unreadable-image, and worker-error states are explicit."
  - id: visual_evidence
    checks:
      - "Source frame, observations, and reconstructed panel can be reviewed together."
      - "Diagrams are generated from actual source or run artifacts."
      - "artifacts/uml/MAP.md or artifacts/visualization/MAP.md explains scope and regeneration."
  - id: verification
    checks:
      - "Tests are run and actual outcomes are recorded."
      - "A missing required artifact blocks completion."
      - "Retry loop is bounded."
      - "No source media is uploaded by default."

safety:
  max_repair_attempts: 2
  human_approval_required_for:
    - destructive_changes
    - credential_or_permission_changes
    - external_publication
    - merge_or_release
