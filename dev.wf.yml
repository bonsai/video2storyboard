schema_version: "1.2"

workflow:
  id: dev
  name: YAML-first storyboard visual reconstruction development
  status: specification
  canonical_definition: "config/storyboard-visualization.yaml"
  purpose: >
    Orchestrate development itself with LangGraph. YAML is the source of truth;
    visualization and shareable artifacts are mandatory outputs.
  orchestration:
    engine: langgraph
    development_itself_is_orchestrated: true
    manual_llm_step_by_step_direction: false
    rule: "Inspect, survey, contract, implement, test, visualize, share, report."
  topology:
    format: directed_graph
    entry: request_normalize
    exit: publish_report
    nodes:
      - id: request_normalize
        owner: coordinator
      - id: inspect_repository
        owner: repository_worker
      - id: survey_reuse
        owner: survey_worker
      - id: define_contracts
        owner: design_worker
      - id: approval_gate
        owner: human
      - id: implement_unit
        owner: implementation_worker
      - id: run_tests
        owner: verification_worker
      - id: diagnose_failure
        owner: verification_worker
      - id: generate_visuals
        owner: visualization_worker
      - id: package_share
        owner: artifact_worker
      - id: publish_report
        owner: coordinator
      - id: blocked_report
        owner: coordinator
    edges:
      - [request_normalize, inspect_repository]
      - [inspect_repository, survey_reuse]
      - [survey_reuse, define_contracts]
      - [define_contracts, approval_gate]
      - [approval_gate, implement_unit]
      - [approval_gate, blocked_report]
      - [implement_unit, run_tests]
      - [run_tests, generate_visuals]
      - [run_tests, diagnose_failure]
      - [diagnose_failure, implement_unit]
      - [diagnose_failure, blocked_report]
      - [generate_visuals, package_share]
      - [generate_visuals, blocked_report]
      - [package_share, publish_report]
    conditional_edges:
      - from: survey_reuse
        condition: "existing_solution_fit"
        true: define_contracts
        false: define_contracts
        note: "Decision and evidence are recorded; custom implementation is allowed only when reuse is unsuitable."
      - from: run_tests
        condition: "all_required_checks_pass"
        true: generate_visuals
        false: diagnose_failure
      - from: diagnose_failure
        condition: "retry_budget_available"
        true: implement_unit
        false: blocked_report
      - from: approval_gate
        condition: "approved"
        true: implement_unit
        false: blocked_report
      - from: generate_visuals
        condition: "required_artifacts_valid"
        true: package_share
        false: blocked_report

scope:
  focus: storyboard_image_reconstruction
  workers:
    - mp_pose
    - cv2
    - vlm
  excluded:
    - stt
    - audio_analysis
    - 3d_character_retargeting
    - unrelated_workers

defaults:
  execution: local_or_reusable_runner
  cloud_fallback: false
  upload_source_media: false
  prefer_existing_libraries: true
  survey_before_custom_implementation: true
  allow_polyglot: true
  interchange_format: json
  execution_log_format: jsonl
  avoid_heavy_local_installation: true

source:
  timeline_file: "timelines.yaml"
  segment_id: skeleton_dance
  interval:
    start: "00:02:20"
    end: "00:03:45"
    start_inclusive: true
    end_inclusive: false
  preserve_source_timestamps: true

workers:
  coordinator:
    responsibility: "Normalize request, route work, maintain run state, and report evidence."
    may_edit_production_code: false
  repository_worker:
    responsibility: "Inspect source, dependencies, tests, workflow, Issues, and artifacts."
    may_edit_production_code: false
  survey_worker:
    responsibility: "Compare reusable libraries, CLI tools, MCP servers, and existing projects."
    may_edit_production_code: false
  design_worker:
    responsibility: "Define YAML contracts, schemas, interfaces, and acceptance criteria."
    may_edit_production_code: false
  implementation_worker:
    responsibility: "Implement one approved, bounded unit."
    may_approve_own_plan: false
  verification_worker:
    responsibility: "Run tests, schema checks, artifact checks, and bounded failure diagnosis."
    may_approve_own_changes: false
  visualization_worker:
    responsibility: "Generate diagrams and storyboard review artifacts from actual source/runtime outputs."
    may_edit_production_code: false
  artifact_worker:
    responsibility: "Package, validate, and link shareable repository artifacts."
    may_edit_production_code: false
  human:
    responsibility: "Approve scope/risky changes and review final results."

tools:
  policy:
    prefer_existing_tools: true
    install_only_if_needed: true
    avoid_duplicate_implementations: true
    record_version_and_invocation: true
  tasks:
    python_structure_uml:
      tool: py2puml
      execution: "reusable_runner_or_project_dev_environment"
      command: "py2puml <python_package_path> <package_root>"
      output: "artifacts/uml/python-structure.puml"
      condition: "python classes/data relationships exist and py2puml supports the target package"
    langgraph_topology:
      tool: "LangGraph graph representation / graph export"
      execution: "project environment"
      output: "artifacts/uml/langgraph-topology.puml"
      condition: "derive from actual graph definition or compiled graph; never infer from class diagram"
    svg_render:
      tool: "PlantUML CLI or existing compatible renderer"
      execution: "reusable_runner_or_project_dev_environment"
      output: "artifacts/uml/*.svg"
      condition: "renderer available; otherwise preserve .puml and report SVG as blocked"
    yaml_validation:
      tool: "existing YAML parser and schema validator"
      execution: "project environment"
      output: "validation report"
    tests:
      tool: "pytest and existing project checks"
      execution: "project environment"
      output: "test report"

development_stages:
  - id: inspect_repository
    action: repository_inspection
    required: true
  - id: survey_reuse
    action: survey_existing_libraries_and_projects
    required: true
    before_custom_implementation: true
  - id: define_contracts
    action: load_and_validate_yaml_contracts
    required: true
  - id: approval_gate
    action: human_approval_for_risky_or_scope_changing_work
    required: true
  - id: implement_unit
    action: implement_small_testable_unit
    required: true
  - id: run_tests
    action: run_tests_and_validate_artifacts
    required: true
  - id: diagnose_failure
    action: diagnose_and_retry_within_budget
    required: true
  - id: generate_visuals
    action: generate_visualization_from_actual_code_and_outputs
    required: true
  - id: package_share
    action: save_artifacts_and_update_map
    required: true
  - id: publish_report
    action: report_evidence_failures_blockers_and_links
    required: true

visualization:
  mandatory: true
  specification: "config/storyboard-visualization.yaml"
  artifacts_root: "artifacts/"
  required_kinds:
    - class_and_data_structure_diagram
    - actual_langgraph_topology_diagram
    - mp_cv2_vlm_worker_contract_diagram
    - storyboard_reconstruction_review
    - human_readable_map
  policy:
    - "Use py2puml only for supported Python class/data relationships."
    - "Generate LangGraph topology from the actual graph definition."
    - "Generate MP/CV2/VLM worker mapping from YAML contracts and registered callables."
    - "Prefer runner/container reuse to installing heavy toolchains on the user's machine."
    - "Do not upload source media to remote runners."
    - "Share repository links to generated artifacts in every completion report."
    - "If required visualization cannot be generated, mark the run blocked."

quality_gates:
  - id: scope
    checks:
      - "Active visual reconstruction path uses MP, CV2, and VLM only."
      - "Audio/STT and 3D retargeting are excluded."
  - id: topology
    checks:
      - "Every workflow node has an owner and documented responsibility."
      - "Edges and conditional routing are explicitly represented in YAML."
      - "Runtime topology matches the canonical YAML or a validation error is raised."
  - id: timeline
    checks:
      - "00:02:20 is included."
      - "00:03:45 is excluded."
      - "Out-of-segment frames never reach reconstruction workers."
  - id: contracts
    checks:
      - "YAML definitions load and validate."
      - "JSON outputs preserve frame ID, source timestamp, dimensions, and coordinate convention."
      - "No-pose, unreadable-image, and worker-error states are explicit."
  - id: visualization
    checks:
      - "Source frame, observations, and reconstructed panel can be reviewed together."
      - "Diagrams are generated from actual source or run artifacts."
      - "MAP documents ownership, generation commands, and limitations."
  - id: verification
    checks:
      - "Tests and artifact validation run before completion is reported."
      - "Missing required artifacts block completion."
      - "Retry loop is bounded."
      - "No source media is uploaded by default."

safety:
  max_repair_attempts: 2
  human_approval_required_for:
    - destructive_changes
    - credential_or_permission_changes
    - external_publication
    - merge_or_release
