<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">V2S — Video2Storyboard sequence</title>
  <desc id="desc">Sequence of video selection, metadata read, shot detection, keyframe extraction, VLM and optional pose analysis, validation, storage, and user review.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker><style>
    text{font-family:Inter,Arial,sans-serif;fill:#172b3a}.title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#526477}
    .head{fill:#e9f3ff;stroke:#3974a8;stroke-width:1.4;rx:8}.participant{stroke:#9baaba;stroke-dasharray:5 5;stroke-width:1.2}
    .name{font-size:13px;font-weight:650;text-anchor:middle}.msg{stroke:#526477;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.ret{stroke:#6c879b;stroke-dasharray:5 4;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
    .label{font-size:12px;fill:#263d50}.note{fill:#fff3df;stroke:#a56b18;stroke-width:1.2;rx:8}.frame{fill:#f7f9fc;stroke:#d5dee8;rx:12}
  </style></defs>
  <rect width="1200" height="820" fill="#fff"/>
  <text x="35" y="43" class="title">V2S — Video2Storyboard Sequence</text><text x="35" y="67" class="sub">Happy path with optional motion cues and validation feedback</text>
  <rect class="head" x="30" y="95" width="130" height="52"/><text class="name" x="95" y="125">User</text>
  <rect class="head" x="185" y="95" width="150" height="52"/><text class="name" x="260" y="125">Import / Review UI</text>
  <rect class="head" x="360" y="95" width="145" height="52"/><text class="name" x="432" y="125">Video Importer</text>
  <rect class="head" x="530" y="95" width="135" height="52"/><text class="name" x="597" y="125">Shot Detector</text>
  <rect class="head" x="690" y="95" width="145" height="52"/><text class="name" x="762" y="125">Keyframe Extractor</text>
  <rect class="head" x="860" y="95" width="125" height="52"/><text class="name" x="922" y="125">VLM Adapter</text>
  <rect class="head" x="1010" y="95" width="150" height="52"/><text class="name" x="1085" y="125">Builder / Validator</text>
  {#dummy}
  <path class="participant" d="M95 147 V775"/><path class="participant" d="M260 147 V775"/><path class="participant" d="M432 147 V775"/><path class="participant" d="M597 147 V775"/><path class="participant" d="M762 147 V775"/><path class="participant" d="M922 147 V775"/><path class="participant" d="M1085 147 V775"/>
  <path class="msg" d="M95 175 H255"/><text class="label" x="115" y="166">Select video</text>
  <path class="msg" d="M260 210 H427"/><text class="label" x="285" y="201">Open video</text>
  <path class="msg" d="M432 245 H592"/><text class="label" x="447" y="236">Metadata + frames</text>
  <path class="ret" d="M592 280 H437"/><text class="label" x="455" y="271">Shot boundaries</text>
  <path class="msg" d="M597 315 H757"/><text class="label" x="610" y="306">Boundaries</text>
  <path class="msg" d="M762 350 H917"/><text class="label" x="775" y="341">Keyframes + timestamps</text>
  <rect class="frame" x="675" y="370" width="310" height="95"/><text class="label" x="690" y="392">Optional: MediaPipe Pose</text><text class="sub" x="690" y="414">Sample frames/video → landmarks and motion cues</text><path class="ret" d="M762 435 H1080"/><text class="label" x="810" y="426">Optional pose cues</text>
  <path class="msg" d="M922 485 H1080"/><text class="label" x="935" y="476">Descriptions + continuity</text>
  <path class="msg" d="M1085 520 H922"/><text class="label" x="930" y="511">Storyboard document</text>
  <rect class="note" x="875" y="540" width="285" height="65"/><text class="label" x="890" y="563">Validate schema, timestamps,</text><text class="label" x="890" y="582">and keyframe asset references</text>
  <path class="msg" d="M1085 625 H260"/><text class="label" x="550" y="616">If valid: save JSON + assets, display panels</text>
  <path class="msg" d="M260 660 H95"/><text class="label" x="105" y="651">Review storyboard</text>
  <path class="msg" d="M95 695 H255"/><text class="label" x="110" y="686">Edit captions / reorder</text>
  <path class="msg" d="M260 730 H1080"/><text class="label" x="530" y="721">Save reviewed JSON</text>
  <text class="sub" x="35" y="790">On validation failure, return panel-specific errors to the review UI instead of saving an invalid artifact.</text>
</svg>