<title id="title">animate_stick_figure.py structure</title>
<desc id="desc">Local JSONL input flows through CLI validation, JSONL parsing and landmark normalization, timestamp sorting, standalone HTML generation, then browser Canvas playback. Input remains unchanged and no network is used.</desc>
