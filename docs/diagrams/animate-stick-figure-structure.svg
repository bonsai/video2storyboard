    .io{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:12}
    .browser{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:12}
    .label{font:600 18px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
    .small{font:14px system-ui,sans-serif;fill:#334155;text-anchor:middle}
    .arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
