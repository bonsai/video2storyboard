<text class="member" x="790" y="410">drawFrame(frame)</text><text class="member" x="790" y="433">drawConnections()</text>
<path class="rel" d="M870 188H910"/><text class="label" x="876" y="178">timeline</text><path class="rel" d="M760 211V340"/><text class="label" x="771" y="290">redraw</text><path class="rel" d="M1020 258V305H890V340"/><text class="label" x="930" y="297">selected frame</text>
<path class="rel dash" d="M550 300H590V700H760V386"/><text class="label" x="596" y="685">HTML template defines runtime</text>
<rect class="note" x="40" y="705" width="520" height="92" rx="8"/><text class="noteText" x="58" y="731">Input JSONL is read-only. Path validation prevents</text><text class="noteText" x="58" y="753">the output HTML from overwriting the input file.</text><text class="noteText" x="58" y="775">Frame and Landmark are data shapes, not runtime classes.</text>
<rect class="note" x="620" y="705" width="550" height="92" rx="8"/><text class="noteText" x="638" y="731">The browser runtime is JavaScript embedded in generated HTML,</text><text class="noteText" x="638" y="753">not Python classes. The page runs locally without network calls.</text><text class="noteText" x="638" y="775">Current scope renders existing timestamped Pose JSONL only.</text>
