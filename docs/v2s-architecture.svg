<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">V2S — Video2Storyboard architecture</title>
  <desc id="desc">Video ingestion, shot detection, keyframe extraction, VLM analysis, storyboard JSON validation, HTML review and export, with optional audio OCR and MediaPipe cues.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526477"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172b3a}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#526477}
      .node{fill:#f5f8fb;stroke:#526477;stroke-width:1.5;rx:12}.analysis{fill:#e9f3ff;stroke:#3974a8}.artifact{fill:#e9f8ef;stroke:#34845a}.review{fill:#fff3df;stroke:#a56b18}
      .label{font-size:15px;font-weight:650;text-anchor:middle}.small{font-size:12px;fill:#526477;text-anchor:middle}
      .edge{fill:none;stroke:#526477;stroke-width:1.8;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="48" class="title">V2S — Video2Storyboard</text>
  <text x="40" y="73" class="subtitle">Video → shot-level visual understanding → editable storyboard</text>
  <rect x="30" y="100" width="1140" height="150" rx="18" fill="#f7f9fc" stroke="#d5dee8"/>
  <text x="50" y="125" class="subtitle">1 · INGEST &amp; FRAME ANALYSIS</text>
  <rect class="node" x="55" y="148" width="180" height="70"/><text class="label" x="145" y="176">Video Import</text><text class="small" x="145" y="197">MP4 · MOV · WebM</text>
  <rect class="node" x="285" y="148" width="180" height="70"/><text class="label" x="375" y="176">Metadata Reader</text><text class="small" x="375" y="197">FPS · duration · size</text>
  <rect class="analysis" x="515" y="148" width="180" height="70"/><text class="label" x="605" y="176">Shot Detection</text><text class="small" x="605" y="197">scene boundaries</text>
  <rect class="analysis" x="745" y="148" width="180" height="70"/><text class="label" x="835" y="176">Keyframe Extraction</text><text class="small" x="835" y="197">representative frames</text>
  <rect class="node" x="975" y="148" width="160" height="70"/><text class="label" x="1055" y="176">Quality Filter</text><text class="small" x="1055" y="197">blur · duplicates</text>
  <path class="edge" d="M235 183 H280"/><path class="edge" d="M465 183 H510"/><path class="edge" d="M695 183 H740"/><path class="edge" d="M925 183 H970"/>
  <rect x="30" y="280" width="1140" height="190" rx="18" fill="#f7f9fc" stroke="#d5dee8"/>
  <text x="50" y="305" class="subtitle">2 · MULTIMODAL STORY ANALYSIS</text>
  <rect class="analysis" x="80" y="335" width="220" height="78"/><text class="label" x="190" y="365">VLM Adapter</text><text class="small" x="190" y="387">provider-independent</text>
  <rect class="analysis" x="380" y="335" width="220" height="78"/><text class="label" x="490" y="365">Visual Description</text><text class="small" x="490" y="387">objects · actions · setting</text>
  <rect class="analysis" x="680" y="335" width="220" height="78"/><text class="label" x="790" y="365">Temporal Story Analysis</text><text class="small" x="790" y="387">continuity · transitions</text>
  <rect class="node" x="960" y="335" width="170" height="78"/><text class="label" x="1045" y="362">Optional Context</text><text class="small" x="1045" y="383">ASR · OCR · Pose</text>
  <path class="edge" d="M1055 218 V260 H190 V330"/><path class="edge" d="M300 374 H375"/><path class="edge" d="M600 374 H675"/><path class="edge optional" d="M960 374 H910"/>
  <text x="50" y="448" class="small" text-anchor="start">MediaPipe contributes pose/motion cues; it does not replace VLM visual understanding.</text>
  <rect x="30" y="500" width="1140" height="220" rx="18" fill="#f7f9fc" stroke="#d5dee8"/>
  <text x="50" y="525" class="subtitle">3 · CANONICAL ARTIFACT, REVIEW &amp; EXPORT</text>
  <rect class="artifact" x="80" y="560" width="220" height="85"/><text class="label" x="190" y="590">Storyboard Builder</text><text class="small" x="190" y="613">ordered panels + captions</text>
  <rect class="artifact" x="380" y="560" width="210" height="85"/><text class="label" x="485" y="590">Storyboard JSON</text><text class="small" x="485" y="613">canonical structured data</text>
  <rect class="artifact" x="670" y="560" width="180" height="85"/><text class="label" x="760" y="590">Schema Validator</text><text class="small" x="760" y="613">timestamps · assets</text>
  <rect class="review" x="920" y="560" width="210" height="85"/><text class="label" x="1025" y="590">HTML Storyboard Viewer</text><text class="small" x="1025" y="613">edit · reorder · export</text>
  <path class="edge" d="M790 413 V480 H190 V555"/><path class="edge" d="M300 602 H375"/><path class="edge" d="M590 602 H665"/><path class="edge" d="M850 602 H915"/>
  <text x="190" y="675" class="small">Keyframe image assets</text><text x="1025" y="675" class="small">JSON · HTML · PDF · PNG</text>
</svg>