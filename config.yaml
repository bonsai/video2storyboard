# Task-specific configuration for video analysis.
# The source remains a video; MediaPipe receives extracted still-image frames only.
schema_version: "1.0"

task:
  id: skeleton_dance_stills
  source_task: video_analysis
  objective: "Analyze only still frames from the 2:20–3:45 skeleton-dance segment."

timeline:
  config_file: timelines.yaml
  selection:
    target_segment_ids:
      - skeleton_dance
    start_inclusive: true
    end_inclusive: false
    preserve_source_timestamps: true
    skip_frames_outside_target_segments: true

input:
  media_type: video
  extraction:
    enabled: true
    image_format: png
    timestamped_frames: true
    interval_seconds: 1.0
    apply_timeline_filter_before_pose: true
  preserve_source_video: true

filters:
  scene_scope:
    mode: allowlist
    include:
      - skeleton_dance
    exclude_unclassified: true
    require_scene_label: true

layers:
  video_analysis:
    enabled: true
    responsibility: "Extract timestamped still frames and apply the configured source-video timeline."
    timeline_ref: timeline.config_file
  mp_python:
    id: eye_pose_mp
    enabled: true
    input_type: still_image
    input_source: timeline_filtered_frames
    static_image_mode: true
    process_video_stream_directly: false
    scene_filter_ref: filters.scene_scope
    allowed_scene_labels:
      - skeleton_dance
    allowed_segment_ids:
      - skeleton_dance
    outputs:
      - pose_landmarks
      - skeleton_overlay_png
      - skeleton_overlay_svg
    skip_policy:
      non_matching_segment: true
      non_matching_scene: true
      unclassified_scene: true
      unreadable_image: record_error
      no_pose_detected: record_not_detected

outputs:
  canonical_format: json
  include_source_timestamp: true
  include_frame_id: true
  include_scene_label: true
  local_only: true

privacy:
  upload_source_media: false
  cloud_fallback: false

notes:
  - "This profile narrows the task; it does not change the canonical storyboard schema."
  - "Only extracted PNG stills within 00:02:20 <= timestamp < 00:03:45 are eligible for MediaPipe pose estimation."
  - "The appearance segment (00:01:45–00:02:20) and performance segment (00:03:45–00:04:57) are excluded."
  - "The runtime must load timelines.yaml and apply the segment filter; this configuration alone does not implement runtime enforcement."
  - "The runtime must supply scene labels before the mp_python scene allowlist can be enforced."
