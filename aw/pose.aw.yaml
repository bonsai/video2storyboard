schema_version: "1.0"
id: pose-layer-scaffold
kind: agent-workflow
status: scaffold
source_of_truth:
  workflow: wf/pose.wf.yml
  api_contract: openapi/pose.yaml
  artifact_contract: contracts/pose-artifact.schema.json
goal: "Make the MediaPipe Pose skeleton layer visible and inspectable."
steps:
  - id: inspect
    responsibility: "Check existing pose_video.py and pose_render.py before adding code."
    output: "inspection report"
  - id: reuse
    responsibility: "Reuse existing MediaPipe/OpenCV dependencies and renderers."
    output: "reuse decision"
  - id: implement
    responsibility: "Connect one input frame to pose estimation and PNG/JSON outputs."
    output: "artifacts/pose/"
  - id: verify
    responsibility: "Run focused tests and validate generated files."
    output: "artifacts/pose/run.jsonl"
  - id: share
    responsibility: "Update MAP and report artifact paths."
    output: "MAP.md"
guardrails:
  - "Do not duplicate an existing pose renderer."
  - "Do not install heavyweight dependencies unless missing and required."
  - "Do not upload source media."
  - "Do not implement dance reconstruction in this milestone."
