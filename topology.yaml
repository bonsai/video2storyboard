# Canonical runtime topology for video2storyboard.
# LM Studio must be running on the same machine as the Python worker.
# Set VIDEO2STORYBOARD_VLM_MODEL to the exact vision-capable model ID shown by LM Studio.
schema_version: "1.0"
project: video2storyboard

runtime:
  orchestrator: langgraph
  entrypoint: src/video2storyboard/graph/workflow.py:app
  execution_mode: local
  output_dir: outputs
  privacy:
    local_inference_only: true
    send_frames_to_cloud: false
    commit_source_media: false
    commit_generated_media: false

workbench:
  sources:
    - id: kaggle_dataset
      kind: dataset
      role: source_video
      enabled: true
    - id: google_colab
      kind: notebook_runtime
      role: optional_remote_execution
      enabled: false
      note: "If Colab is used, localhost refers to the Colab VM, not the user's desktop."
    - id: google_drive
      kind: artifact_storage
      role: optional_input_output_mount
      enabled: false

inputs:
  video:
    required: true
    field: source_video
    accepted: local_file_path
  frame_sampling:
    interval_seconds: 1.0
    image_format: png

providers:
  vlm:
    id: lm_studio_local
    enabled: true
    protocol: openai_compatible_chat_completions
    base_url: ${LM_STUDIO_BASE_URL:-http://127.0.0.1:1234/v1}
    endpoint: /chat/completions
    model: ${VIDEO2STORYBOARD_VLM_MODEL}
    api_key_env: LM_STUDIO_API_KEY
    api_key_optional: true
    capabilities:
      vision: required
      json_output: preferred
    request:
      temperature: 0.1
      max_tokens: 700
      timeout_seconds: 120
      image_transport: data_url_base64
    prompt:
      system: >-
        You analyze a single sampled video frame for a storyboard. Describe only
        visible evidence. Return a JSON object with description, subjects,
        actions, setting, shot_type, camera_angle, composition, mood, and
        uncertainty. Do not infer identity or events not supported by the frame.
      user: >-
        Describe this frame for a storyboard. Separate direct observations from
        uncertain interpretation. Keep the description concise and useful for
        continuity across adjacent frames.
    failure_policy:
      retry_count: 2
      retry_backoff_seconds: 2
      on_unavailable: record_worker_error
      on_invalid_json: record_worker_error
  pose:
    id: mediapipe_pose
    runtime: python
    package: mediapipe
    enabled: true
  composition:
    id: opencv_measurements
    runtime: python
    package: opencv-python-headless
    enabled: true
  stt:
    id: faster_whisper
    runtime: python
    package: faster-whisper
    enabled: true
    audio_extractor: ffmpeg
    defaults:
      model: base
      device: cpu
      compute_type: int8

graph:
  nodes:
    - ingest_video
    - video2png
    - eye_pose_mp
    - eye_composition_cv2
    - eye_meaning_vlm
    - ear_stt_whisper
    - hand_storyboard_builder
    - paper_html_svg
    - validate_storyboard
  edges:
    - from: START
      to: ingest_video
    - from: ingest_video
      to: video2png
      when: status_not_failed
    - from: ingest_video
      to: END
      when: status_failed
    - from: video2png
      to: eye_pose_mp
    - from: video2png
      to: eye_composition_cv2
    - from: video2png
      to: eye_meaning_vlm
    - from: video2png
      to: ear_stt_whisper
    - from:
        - eye_pose_mp
        - eye_composition_cv2
        - eye_meaning_vlm
        - ear_stt_whisper
      to: hand_storyboard_builder
      join: all
    - from: hand_storyboard_builder
      to: paper_html_svg
    - from: paper_html_svg
      to: validate_storyboard
    - from: validate_storyboard
      to: END

workers:
  eye_meaning_vlm:
    provider_ref: providers.vlm
    input:
      image_path_field: image
      frame_id_field: frame_id
      timestamp_field: timestamp_seconds
    output:
      field: meaning_results
      required_keys:
        - description
        - subjects
        - actions
        - setting
        - shot_type
        - camera_angle
        - composition
        - mood
        - uncertainty
  hand_storyboard_builder:
    input_fields:
      - frames
      - pose_results
      - composition_results
      - meaning_results
      - transcript_segments
    output_field: storyboard
  paper_html_svg:
    output_files:
      - storyboard.json
      - storyboard.html
      - storyboard.svg

quality_gates:
  - id: source_video_readable
    after: ingest_video
    required: true
  - id: storyboard_structure_valid
    after: validate_storyboard
    required: true
  - id: preserve_worker_errors
    required: true

environment:
  LM_STUDIO_BASE_URL:
    default: http://127.0.0.1:1234/v1
    description: "LM Studio OpenAI-compatible API base URL"
  VIDEO2STORYBOARD_VLM_MODEL:
    required: true
    description: "Exact model ID from GET /v1/models; must support image input"
  LM_STUDIO_API_KEY:
    required: false
    description: "Only needed if LM Studio server authentication is enabled"

notes:
  - "This file declares intended topology; workflow.py currently wires the graph in Python."
  - "The current eye_meaning_vlm node still expects config.vlm_callable. A provider adapter must read this topology and call LM Studio before this setting is operational."
  - "Do not use a text-only model for the VLM worker."
