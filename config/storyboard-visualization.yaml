schema_version: "1.1"

project:
  id: storyboard_visual_reconstruction
  status: specification
  goal: "Reconstruct the visual content of storyboard panels from source frames."
  canonical_definition: "config/storyboard-visualization.yaml"
  requirement: "Every development change must include inspectable visualization and a shareable artifact, or an explicit blocker."

scope:
  focus: storyboard_image_reconstruction
  include:
    - "Reconstruct storyboard panel imagery from source frames and structured observations."
    - "Review source frame, pose, CV2 measurements, VLM description, and reconstructed panel together."
    - "Share generated artifacts and a human-readable MAP."
  exclude:
    - audio_and_speech_transcription
    - full_video_understanding_beyond_panel_reconstruction
    - 3d_character_retargeting
    - mp4_assembly_until_panel_reconstruction_is_verified
    - unrelated_plugin_expansion

workers:
  allowed:
    - id: mp_pose
      alias: MP
      responsibility: "Extract human pose landmarks from PNG frames."
      input: "PNG frame + source timestamp + frame ID"
      output: "Versioned JSON landmarks with visibility and explicit no-pose/error status"
      implementation: "Reuse MediaPipe Pose; local execution"
    - id: cv2
      responsibility: "Measure image/frame geometry and support image processing for panel reconstruction."
      input: "PNG frame"
      output: "JSON measurements and/or derived image artifacts"
      implementation: "Reuse OpenCV; local execution"
    - id: vlm
      responsibility: "Describe visible semantic content needed to reconstruct the storyboard panel."
      input: "Source frame and selected structured observations"
      output: "Structured JSON description with evidence/status"
      implementation: "Provider-neutral adapter; local-first; no silent cloud fallback"
  prohibited_workers:
    - stt
    - audio_analysis
    - unrelated_semantic_workers
    - 3d_retargeting

development:
  orchestrator: langgraph
  yaml_is_source_of_truth: true
  separation_of_duties:
    - role: coordinator
      owns: [request_normalization, routing, run_state, final_report]
      may_edit_code: false
    - role: repository_survey
      owns: [repository_inspection, dependency_inspection, library_survey, evidence]
      may_edit_code: false
    - role: designer
      owns: [contracts, schemas, architecture, acceptance_criteria]
      may_edit_code: false
    - role: implementer
      owns: [one_bounded_implementation_unit]
      may_approve_own_plan: false
    - role: verifier
      owns: [tests, schema_checks, artifact_checks, failure_diagnosis]
      may_approve_own_changes: false
    - role: visualizer
      owns: [code_diagrams, graph_topology, worker_map, storyboard_review]
      may_edit_production_code: false
    - role: publisher
      owns: [artifact_packaging, MAP, repository_links]
      may_edit_production_code: false
    - role: human
      owns: [risk_approval, external_publication_approval, merge_release_review]

topology:
  type: directed_graph
  entry: request_normalize
  exit: publish_report
  nodes:
    - {id: request_normalize, owner: coordinator}
    - {id: inspect_repository, owner: repository_survey}
    - {id: survey_reuse, owner: repository_survey}
    - {id: define_contracts, owner: designer}
    - {id: approval_gate, owner: human}
    - {id: implement_unit, owner: implementer}
    - {id: run_tests, owner: verifier}
    - {id: diagnose_failure, owner: verifier}
    - {id: generate_visuals, owner: visualizer}
    - {id: package_share, owner: publisher}
    - {id: publish_report, owner: coordinator}
    - {id: blocked_report, owner: coordinator}
  edges:
    - [request_normalize, inspect_repository]
    - [inspect_repository, survey_reuse]
    - [survey_reuse, define_contracts]
    - [define_contracts, approval_gate]
    - [approval_gate, implement_unit]
    - [approval_gate, blocked_report]
    - [implement_unit, run_tests]
    - [run_tests, generate_visuals]
    - [run_tests, diagnose_failure]
    - [diagnose_failure, implement_unit]
    - [diagnose_failure, blocked_report]
    - [generate_visuals, package_share]
    - [generate_visuals, blocked_report]
    - [package_share, publish_report]
  conditional_edges:
    - {from: approval_gate, condition: approved, true: implement_unit, false: blocked_report}
    - {from: run_tests, condition: all_required_checks_pass, true: generate_visuals, false: diagnose_failure}
    - {from: diagnose_failure, condition: retry_budget_available, true: implement_unit, false: blocked_report}
    - {from: generate_visuals, condition: required_artifacts_valid, true: package_share, false: blocked_report}
  invariant: "Runtime graph must match this declared topology or fail validation."

tools:
  reuse_policy:
    survey_before_custom_implementation: true
    inspect_repository_before_install: true
    prefer_existing_cli_library_mcp_or_runner: true
    avoid_duplicate_implementation: true
    record_version_command_license_and_limitations: true
  local_resource_policy:
    avoid_heavy_local_installation: true
    prefer_existing_environment_or_reusable_runner: true
    remote_execution_requires_explicit_approval: true
    source_media_must_not_be_uploaded: true
  integrations:
    - id: py2puml
      purpose: "Python class/data relationship diagrams where supported."
      stage: generate_visuals
      invocation: "py2puml <python_package_path> <package_root>"
      output: "artifacts/uml/python-structure.puml"
      limitations: "Does not represent LangGraph edges or function-only worker execution completely."
    - id: plantuml_renderer
      purpose: "Render .puml to SVG when renderer is available."
      stage: generate_visuals
      preferred_execution: reusable_runner_or_existing_dev_environment
      output: "artifacts/uml/*.svg"
      fallback: "Keep .puml source and report SVG rendering as blocked."
    - id: langgraph_topology_export
      purpose: "Export actual LangGraph nodes and edges."
      stage: generate_visuals
      source: "compiled graph or graph definition"
      output: "artifacts/uml/langgraph-topology.puml"
    - id: storyboard_review
      purpose: "Build HTML/SVG review panel from source frame and MP/CV2/VLM outputs."
      stage: generate_visuals
      output: "artifacts/visualization/storyboard-review.html"

contracts:
  interchange: json
  event_log: jsonl
  schemas:
    pose: "schemas/pose.schema.json"
    storyboard: "schemas/storyboard.schema.json"
  requirements:
    - stable_frame_id_and_source_timestamp
    - source_dimensions_and_coordinate_convention
    - explicit_detected_not_detected_and_error_states
    - separate_image_coordinates_from_3d_world_coordinates
    - reconstructed_panel_references_source_frame_and_evidence

source:
  timeline_file: "timelines.yaml"
  segment_id: skeleton_dance
  interval:
    start: "00:02:20"
    end: "00:03:45"
    start_inclusive: true
    end_inclusive: false
  preserve_source_timestamps: true
  local_only: true
  cloud_fallback: false
  upload_source_media: false

visualization:
  mandatory_for_development: true
  generated_from:
    - actual_python_code
    - actual_langgraph_topology
    - actual_mp_cv2_vlm_worker_contracts
    - actual_run_artifacts
  artifacts:
    - {path: "artifacts/uml/python-structure.puml", purpose: "py2puml-supported class/data structure"}
    - {path: "artifacts/uml/langgraph-topology.puml", purpose: "actual graph node/edge topology"}
    - {path: "artifacts/uml/worker-contracts.puml", purpose: "MP/CV2/VLM contract and callable mapping"}
    - {path: "artifacts/visualization/storyboard-review.html", purpose: "source, evidence, and reconstructed panel review"}
    - {path: "artifacts/visualization/MAP.md", purpose: "navigation, ownership, limitations, regeneration"}
  policy:
    - "Generated diagrams must not be mislabeled as py2puml output."
    - "Do not infer unsupported function-level relationships from class diagrams."
    - "Share repository links to artifacts in each completion report."
    - "Missing required artifacts block completion."

quality_gates:
  - "Only MP, CV2, and VLM workers are active in the reconstruction path."
  - "00:02:20 is included and 00:03:45 is excluded."
  - "Runtime loads/validates this YAML and verifies graph topology against it."
  - "Each stage has independently testable inputs and outputs."
  - "Source frame, observations, and reconstructed panel are reviewable together."
  - "Diagrams are generated from actual source/runtime outputs."
  - "Tests and artifact checks pass before completion is reported."
  - "No source media is uploaded by default."

safety:
  max_repair_attempts: 2
  human_approval_required_for:
    - destructive_changes
    - credential_or_permission_changes
    - external_publication
    - merge_or_release
