schema_version: "1.0"
id: "anime-studio-automation"
title: "Pythonでアニメ制作スタジオを自動化する"
language: "ja"
duration_seconds: 180
purpose:
  - "ソフトウェアファクトリの考え方をアニメ制作へ応用する"
  - "お手本動画から動きの特徴を抽出・蓄積する"
  - "将来的に判断の学習と動きの再現を目指す"

core_message: >
  作業の自動化だけでなく、良い作品を作るための判断を学習できる仕組みを目指す。
  今回はその第一段階として、MediaPipe Poseによる姿勢取得に限定する。

timeline:
  - id: "background"
    start: "00:00"
    end: "00:30"
    title: "背景と目的"
    narration: >
      Pythonを使って、アニメ制作スタジオの作業を自動化できないかと考え、
      調査・企画を始めました。ソフトウェア開発の工程を工場のように管理する
      「ソフトウェアファクトリ」という考え方を、アニメ制作に応用しようとしています。
    visual:
      - "アニメ制作工程の全体像"
      - "ソフトウェアファクトリからアニメ制作への応用"

  - id: "bottleneck"
    start: "00:30"
    end: "01:00"
    title: "自動化のボトルネックは判断"
    narration: >
      作業そのものは自動化できそうです。しかし、良い映像を作るには、
      どの動きが良いのか、どの構図が効果的なのかという「判断」が必要です。
      自動化するだけでなく、判断そのものを学習させることが課題だと考えました。
    visual:
      - "作業の自動化と判断の対比"

  - id: "workflow"
    start: "01:00"
    end: "01:35"
    title: "動画から絵コンテへのワークフロー"
    narration: >
      そこで、まずはお手本となる動画から、良いアニメの特徴を抽出して
      蓄積することが重要だと考えました。動画を分析し、絵コンテに起こすための
      ワークフローを設計しました。今回は最初の段階として、姿勢取得に限定しています。
    visual:
      - "お手本動画"
      - "姿勢データ"
      - "特徴の蓄積"
      - "絵コンテ"

  - id: "demo"
    start: "01:35"
    end: "02:15"
    title: "MediaPipe Poseのデモ"
    narration: >
      GoogleのMediaPipe Poseを使って、人物の姿勢を取得します。
      JavaScriptでも実行できますが、今回はPythonでデータを処理し、
      蓄積していく構成を目指しています。まずは動画上の人物の骨格を取得できることを確認します。
    demo:
      enabled: true
      technology: "MediaPipe Pose"
      language: "Python"
      show:
        - "入力動画"
        - "骨格オーバーレイ"
      scope: "人物の姿勢取得のみ"
      excluded:
        - "CV2を使った追加機能の開発"
        - "VLMによる意味理解"
        - "ダンスの再構成"
    visual:
      - "ローカル動画と骨格オーバーレイを実演"

  - id: "future"
    start: "02:15"
    end: "02:45"
    title: "動きの意味の発見と再現"
    narration: >
      取得した姿勢データを蓄積し、動きやダンスの特徴、さらにその意味を
      発見していきたいと考えています。最終的には、動きを再現したり、
      絵コンテやアニメーション制作につなげたりすることが目標です。
    visual:
      - "姿勢データ"
      - "動きの分析"
      - "特徴の蓄積"
      - "動きの再現"

  - id: "summary"
    start: "02:45"
    end: "03:00"
    title: "まとめ"
    narration: >
      今回の成果は、アニメ制作の自動化に向けたワークフローを設計し、
      姿勢取得という最初の工程に取り組んだことです。
      良い作品を作るための判断を学習できる仕組みを目指します。
    visual:
      - "今回の成果と今後の展望"

implementation_status:
  workflow_design: "planned"
  pose_demo_runtime_verified: false
  note: "デモは発表前にローカル動画で動作確認すること。"

principles:
  - "ローカル処理を優先し、動画をクラウドへアップロードしない"
  - "入力動画を上書きしない"
  - "今回は姿勢取得に限定し、CV2の追加機能とVLMは後回し"
